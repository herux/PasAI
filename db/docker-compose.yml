# PostgreSQL for the PasAI examples.
#
#   docker compose -f db/docker-compose.yml up -d     start
#   docker compose -f db/docker-compose.yml down      stop (data is kept)
#   docker compose -f db/docker-compose.yml down -v   stop and delete the data
#
# Port 5433 on the Mac avoids clashing with any PostgreSQL already on 5432.
# The password is for local development only.

services:
  postgres:
    image: postgres:16
    container_name: pasai-postgres
    environment:
      POSTGRES_DB: pasai
      POSTGRES_USER: pasai
      POSTGRES_PASSWORD: pasai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pasai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pasai -d pasai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pasai-pgdata:
